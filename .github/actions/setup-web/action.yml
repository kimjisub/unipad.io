name: Set up web dependencies
description: Installs the pinned Node.js and pnpm, restores the pnpm store and installs the locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.15.0
    # Installs the pnpm version pinned in package.json's packageManager field. A global npm
    # install keeps pnpm under node_modules, where Node does not flag its url.parse() use.
    - name: Set up pnpm
      shell: bash
      run: npm install --global "$(node -p 'require("./package.json").packageManager')"
    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
