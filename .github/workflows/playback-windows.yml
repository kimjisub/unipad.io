name: Windows playback

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-playback-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  playback:
    name: Windows playback (${{ matrix.project }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, chrome, msedge]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: 'FAKE_CI_KEY_DO_NOT_USE'
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'unipad-ci.invalid'
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: 'https://unipad-browser-test.firebaseio.com'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'unipad-ci-placeholder'
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'unipad-ci.invalid'
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:fake-ci-placeholder'
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-FAKE-CI'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Build
        run: pnpm build
      - name: Install Chromium
        if: matrix.project == 'chromium'
        run: pnpm exec playwright install chromium
      # Hosted Windows runners have no sound card and leave the Windows Audio service stopped.
      # Chromium then plays into a fake output, but Firefox never starts Web Audio, so a pad stays
      # silent and Auto never starts. The open-source Scream virtual sound card is the output here.
      - name: Add a virtual audio output
        timeout-minutes: 5
        run: |
          Get-Service audiosrv | Format-Table -AutoSize Name, Status, StartType
          Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue | Format-Table -AutoSize FriendlyName, Status
          $zip = "$env:RUNNER_TEMP\Scream.zip"
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'FA33E25F9A46C61E4E0CD83362C51C3D2A45C6FE4091AAD7507E240E40F1A520') { throw 'Scream4.0.zip does not match its recorded SHA-256' }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\Scream"
          $driver = "$env:RUNNER_TEMP\Scream\Install\driver\x64"
          # The release's catalog signature has expired; re-sign it with a certificate only this runner trusts.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Playback test audio output' -CertStoreLocation Cert:\LocalMachine\My
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\scream.cer" | Out-Null
          foreach ($store in 'Root', 'TrustedPublisher') { Import-Certificate -FilePath "$env:RUNNER_TEMP\scream.cer" -CertStoreLocation "Cert:\LocalMachine\$store" | Out-Null }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sm /sha1 $cert.Thumbprint "$driver\scream.cat"
          if ($LASTEXITCODE) { throw "signtool failed with $LASTEXITCODE" }
          & "$env:RUNNER_TEMP\Scream\Install\helpers\devcon-x64.exe" install "$driver\Scream.inf" '*Scream'
          if ($LASTEXITCODE) { throw "devcon failed with $LASTEXITCODE" }
          Start-Service audiosrv
          Get-PnpDevice -Class AudioEndpoint -PresentOnly | Format-Table -AutoSize FriendlyName, Status
          if (-not (Get-PnpDevice -Class AudioEndpoint -Status OK -PresentOnly -ErrorAction SilentlyContinue)) { throw 'No audio output device is available' }
      # Chrome and Edge are installed on the Windows runner. A missing channel fails the job.
      - name: Check playback, multi-touch and layout
        id: playback
        run: pnpm exec playwright test e2e/play.spec.ts e2e/multi-touch.spec.ts e2e/pad-layout.spec.ts e2e/rectangular-pad-layout.spec.ts e2e/large-text.spec.ts e2e/home.spec.ts --project=${{ matrix.project }}
      # Only after the tests ran: an earlier setup or build failure stays the only error.
      - name: Save playback results, skip reasons and failure traces
        if: always() && steps.playback.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-playback-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: error
      - name: Summarize results
        if: always() && steps.playback.outcome != 'skipped'
        run: |
          node scripts/playback-summary.mjs >> $env:GITHUB_STEP_SUMMARY
